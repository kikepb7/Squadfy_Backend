name: Release tag

# Every merge into master (production) is a release: tag it as v<version> from gradle.properties and
# publish a GitHub Release with the merged pull requests as notes. The version is bumped on develop.
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "tag=v$(grep -E '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::warning::$TAG already exists; bump the version in gradle.properties on develop for the next release"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
