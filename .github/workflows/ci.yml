name: CI

# Flow: feature/* -> develop -> release (staging) -> master (production). Render deploys release and
# master only after this workflow is green on the commit (autoDeployTrigger: checksPass, see render.yaml).
on:
  pull_request:
    branches: [develop, release, master]
  push:
    branches: [develop, release, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Unit + integration tests (Testcontainers uses the runner's Docker daemon)
      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Validates the image builds; Render builds and deploys its own image from the Dockerfile.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: squadfy-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
