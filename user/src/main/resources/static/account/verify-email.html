<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Verificar email · Squadfy</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5b6475; --border: #d9dde5;
      --accent: #c62828; --accent-text: #ffffff; --ok: #1b7f3b; --focus: #2f6fdd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --card: #1b2029; --text: #e8ebf1; --muted: #a3abba; --border: #323a48;
        --accent: #ef5350; --accent-text: #12151b; --ok: #66bb6a; --focus: #7aa7ff;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    h2 { font-size: 1rem; margin: 24px 0 8px; }
    p, li { color: var(--muted); }
    ul { padding-left: 20px; margin: 0; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input[type=email], input[type=password] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-size: 1rem;
    }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; color: var(--text); }
    .check input { margin-top: 4px; width: 18px; height: 18px; }
    button {
      margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 8px;
      background: var(--accent); color: var(--accent-text); font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .message { margin-top: 16px; font-weight: 600; }
    .message.error { color: var(--accent); }
    .message.ok { color: var(--ok); }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Verificando tu email…</h1>
    <p id="message" class="message" role="status" aria-live="polite">Un momento.</p>
    <p id="hint"></p>
  </div>
</main>
<script>
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const hint = document.getElementById('hint');

  function show(heading, text, kind, extra) {
    title.textContent = heading;
    message.textContent = text;
    message.className = 'message ' + kind;
    hint.textContent = extra || '';
  }

  async function verify() {
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      show('Enlace no válido', 'Al enlace le falta el código de verificación.', 'error', 'Abre el enlace completo del correo o pide otro desde la app.');
      return;
    }
    try {
      const response = await fetch('/api/v1/auth/verify?token=' + encodeURIComponent(token));
      if (response.ok) {
        show('¡Email verificado!', 'Tu cuenta ya está lista.', 'ok', 'Vuelve a la app de Squadfy e inicia sesión.');
        return;
      }
      const body = await response.json().catch(() => ({}));
      const detail = (body.message || '').toLowerCase();
      if (detail.includes('already used')) {
        show('Email ya verificado', 'Este enlace ya se usó, así que tu email está verificado.', 'ok', 'Vuelve a la app e inicia sesión.');
      } else if (detail.includes('expired')) {
        show('Enlace caducado', 'El enlace de verificación ha caducado.', 'error', 'Desde la app puedes pedir que te enviemos otro.');
      } else {
        show('Enlace no válido', 'No hemos podido verificar tu email con este enlace.', 'error', 'Desde la app puedes pedir que te enviemos otro.');
      }
    } catch (error) {
      show('Sin conexión', 'No hemos podido conectar con Squadfy.', 'error', 'Vuelve a abrir el enlace dentro de un rato.');
    }
  }

  verify();
</script>
</body>
</html>
