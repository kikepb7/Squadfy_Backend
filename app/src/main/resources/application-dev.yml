# Local development: verbose SQL and long-lived access tokens.
spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true

jwt:
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1000}

nginx:
  require-proxy: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
