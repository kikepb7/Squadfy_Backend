# Every infrastructure value comes from environment variables (see .env.example).
# Defaults target the local stack started with `docker compose up` (docker-compose.yml).
spring:
  application:
    name: squadfy

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/squadfy}
    username: ${DB_USERNAME:squadfy}
    password: ${DB_PASSWORD:squadfy}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000
      validation-timeout: 5000
      pool-name: SquadfyHikariCP
      data-source-properties:
        prepareThreshold: 5
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5
        tcpKeepAlive: true
        socketTimeout: 30
        connectTimeout: 10

  # The schema is owned by Flyway (app/src/main/resources/db/migration); Hibernate only validates it.
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: user_service,chat_service,notification_service,club_service,match_service
    default-schema: public
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 5000ms
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 3
        prefetch: 10
        default-requeue-rejected: true
        retry:
          enabled: true
          initial-interval: 1000ms
          max-interval: 1000ms
          max-attempts: 3
          multiplier: 2

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

jwt:
  secret: ${JWT_SECRET_BASE64}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}

squadfy:
  rate-limit:
    ip:
      apply-limit: ${RATE_LIMIT_ENABLED:false}
  email:
    from: ${MAIL_FROM:no-reply@squadfy.local}
    url: ${APP_PUBLIC_URL:http://localhost:8080}
    verification:
      expiry-hours: 24
    reset-password:
      expiry-minutes: 30
  web-socket:
    allowed-origin: ${WEBSOCKET_ALLOWED_ORIGIN:http://localhost:8080}

nginx:
  require-proxy: ${NGINX_REQUIRE_PROXY:true}
  trusted-ips:
    - "127.0.0.1" # nginx on same machine
    - "::1" # IPv6 localhost
    - "172.17.0.0/16" # nginx container IP when using Docker
    - "10.0.0.5/32" # nginx server IP (if separate machine)

supabase:
  project-url: ${SUPABASE_PROJECT_URL:http://localhost:54321}
  service-key: ${SUPABASE_SERVICE_KEY:}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-credentials/squadfy-backend-firebase-adminsdk.json}
